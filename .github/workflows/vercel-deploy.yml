# Vercel Hobby blocks @users.noreply.github.com — use your primary GitHub email.
#
# GitHub repo secrets (required):
#   VERCEL_TOKEN      → https://vercel.com/account/tokens
#   GIT_COMMIT_EMAIL  → primary verified email from https://github.com/settings/emails
#   GIT_COMMIT_NAME   → e.g. Abdallahe Benahmed (optional; defaults below)
#
# Vercel → Project → Settings → Git → Disconnect (use this workflow only)
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_jJj8ineTVhnfuqYzjx4eKMIE
  VERCEL_PROJECT_ID: prj_NjKMyXxwICNvmVWnfYIEq5LsnMj8

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::Missing VERCEL_TOKEN secret"
            exit 1
          fi
          if [ -z "${{ secrets.GIT_COMMIT_EMAIL }}" ]; then
            echo "::error::Missing GIT_COMMIT_EMAIL — use your primary GitHub email, NOT @users.noreply.github.com"
            exit 1
          fi

      - name: Fix git author for Vercel (noreply emails are rejected)
        env:
          COMMIT_EMAIL: ${{ secrets.GIT_COMMIT_EMAIL }}
          COMMIT_NAME: ${{ secrets.GIT_COMMIT_NAME }}
        run: |
          NAME="${COMMIT_NAME:-Abdallahe Benahmed}"
          git config user.email "$COMMIT_EMAIL"
          git config user.name "$NAME"
          AUTHOR_EMAIL=$(git log -1 --format='%ae')
          if echo "$AUTHOR_EMAIL" | grep -qE 'noreply\.github\.com|z@container'; then
            git commit --amend --no-edit --allow-empty --author="$NAME <$COMMIT_EMAIL>"
            echo "Rewrote author to: $NAME <$COMMIT_EMAIL>"
          else
            echo "Author already valid: $(git log -1 --format='%an <%ae>')"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
