# Deploy with Vercel CLI + API token (bypasses Hobby git-author checks).
# Deploy Hooks still deploy the latest git commit and can be blocked the same way.
#
# One-time setup:
# 1. Vercel → Account → Tokens → create token → GitHub secret VERCEL_TOKEN
# 2. Vercel → Project → Settings → Git → Disconnect (stops blocked git deploys)
# 3. GitHub → repo → Settings → Secrets → VERCEL_TOKEN
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_jJj8ineTVhnfuqYzjx4eKMIE
  VERCEL_PROJECT_ID: prj_NjKMyXxwICNvmVWnfYIEq5LsnMj8

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
