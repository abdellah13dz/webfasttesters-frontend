# Bypasses Vercel Hobby "commit author" blocks by deploying via Deploy Hook (not Git webhook).
#
# Setup (one time):
# 1. Vercel → Project → Settings → Git → Deploy Hooks → Create (branch: main)
# 2. GitHub → repo Settings → Secrets → Actions → VERCEL_DEPLOY_HOOK = hook URL
name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Add VERCEL_DEPLOY_HOOK in GitHub repo Secrets (Vercel → Settings → Git → Deploy Hooks)."
            exit 1
          fi
          curl -fsS -X POST "$HOOK"
          echo "Deploy hook triggered."
